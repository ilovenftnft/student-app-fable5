<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #121417; color: #e8e8e4; font-family: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif; font-size: 16px; line-height: 24px; }
    a { color: #7ee2a8; } a:hover { color: #a3ecc2; }
    .mono { font-family: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 480px; min-height: 860px; box-sizing: border-box; background: #121417; color: #e8e8e4; padding: 28px 20px; display: flex; flex-direction: column;">
  <header class="mono" style="display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: #7d8590;"><span>周二 · 9 月 1 日</span><span>本周 3 / 5</span></header>
  <div style="margin-top: 48px; display: flex; flex-direction: column; gap: 10px; font-size: 19px; line-height: 30px;">
    <p style="margin: 0;">昨天那两句《夜雨寄北》，你今天大概率还记得，先试试。</p>
    <p style="margin: 0; color: #7d8590;">一共 9 张，8 分钟左右。</p>
  </div>
  <p style="margin: 40px 0 12px; font-size: 13px; line-height: 18px; color: #7d8590;">先做哪科，你定。</p>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="box-sizing: border-box; padding: 18px; background: #1c2027; border: 1px solid #7ee2a8; border-radius: 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between;"><span style="font-size: 20px; line-height: 28px; font-weight: 500;">语文</span><span class="mono" style="font-size: 12px; color: #7d8590;">2 张 · 默写</span></div>
    <div style="box-sizing: border-box; padding: 18px; background: #1c2027; border: 1px solid #2a2f36; border-radius: 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between;"><span style="font-size: 20px; line-height: 28px; font-weight: 500;">地理</span><span class="mono" style="font-size: 12px; color: #7d8590;">4 张 · 3 分钟</span></div>
    <div style="box-sizing: border-box; padding: 18px; background: #1c2027; border: 1px solid #2a2f36; border-radius: 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between;"><span style="font-size: 20px; line-height: 28px; font-weight: 500;">数学</span><span class="mono" style="font-size: 12px; color: #7d8590;">3 张 · 1 张错题</span></div>
    <div style="box-sizing: border-box; padding: 18px; border: 1px dashed #2a2f36; border-radius: 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; color: #7d8590;"><span style="font-size: 20px; line-height: 28px;">英语</span><span class="mono" style="font-size: 12px;">今天没有</span></div>
  </div>
  <div style="margin-top: 20px; display: flex; gap: 8px; align-items: center; font-size: 13px; line-height: 18px; color: #7d8590;">
    <span>今天</span>
    <span style="padding: 6px 12px; border: 1px solid #7ee2a8; border-radius: 999px; color: #e8e8e4;">只做到期的</span>
    <span style="padding: 6px 12px; border: 1px solid #2a2f36; border-radius: 999px;">再多 5 张</span>
  </div>
  <div style="flex: 1;"></div>
  <div style="padding: 16px 20px; background: #7ee2a8; color: #0f1a14; border-radius: 10px; text-align: center; font-size: 18px; line-height: 24px; font-weight: 500;">从语文开始</div>
</div>
</x-dc>
</body>
</html>
