<!doctype html>
<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #121417; color: #e8e8e4; font-family: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif; font-size: 16px; line-height: 24px; }
    a { color: #7ee2a8; } a:hover { color: #a3ecc2; }
    .mono { font-family: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 480px; min-height: 860px; box-sizing: border-box; background: #121417; color: #e8e8e4; padding: 28px 20px; display: flex; flex-direction: column;">
  <header class="mono" style="display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: #7d8590;"><span>回想 · 2/4</span><span>1 分钟</span></header>
  <div style="display: flex; gap: 4px; margin-top: 14px;">
    <div style="flex: 1; height: 3px; background: #7ee2a8;"></div>
    <div style="flex: 1; height: 3px; background: #e8e8e4;"></div>
    <div style="flex: 1; height: 3px; background: #2a2f36;"></div>
    <div style="flex: 1; height: 3px; background: #2a2f36;"></div>
  </div>

  <p class="mono" style="margin: 40px 0 0; font-size: 12px; line-height: 16px; color: #7d8590; letter-spacing: 1px;">数学 · 1.4 有理数的乘除法</p>
  <h1 style="margin: 12px 0 4px; font-size: 26px; line-height: 36px; font-weight: 500;">这一节讲了什么？</h1>
  <p style="margin: 0 0 24px; color: #7d8590;">心里过一遍就行。想不起来的，点一下。</p>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="box-sizing: border-box; padding: 14px 16px; background: #1c2027; border: 1px solid #2a2f36; border-radius: 10px; font-size: 16px; line-height: 24px;">两数相乘，同号得正，异号得负，并把绝对值相乘</div>
    <div style="box-sizing: border-box; padding: 14px 16px; background: #1c2027; border: 1px solid #2a2f36; border-radius: 10px; font-size: 16px; line-height: 24px;">任何数与 0 相乘，都得 0</div>
    <div style="box-sizing: border-box; padding: 14px 16px; background: #1c2027; border: 1px solid #7ee2a8; border-radius: 10px; font-size: 16px; line-height: 24px;">乘积是 1 的两个数互为倒数</div>
    <div style="box-sizing: border-box; padding: 14px 16px; background: #1c2027; border: 1px solid #7ee2a8; border-radius: 10px; font-size: 16px; line-height: 24px;">除以一个不等于 0 的数，等于乘这个数的倒数</div>
    <div style="box-sizing: border-box; padding: 14px 16px; background: #1c2027; border: 1px solid #2a2f36; border-radius: 10px; font-size: 16px; line-height: 24px;">几个不为 0 的数相乘，负因数的个数是偶数时积为正</div>
  </div>
  <div style="flex: 1;"></div>
  <div style="margin-top: 24px; padding: 16px 20px; background: #7ee2a8; color: #0f1a14; border-radius: 10px; text-align: center; font-size: 18px; line-height: 24px; font-weight: 500;">2 条明天再看</div>
</div>
